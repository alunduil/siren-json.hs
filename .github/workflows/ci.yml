name: CI

# Sensors that run on every integration event. Path-gated checks would have a
# narrower "when" and keep their own files.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Stopgap: the test-only network-arbitrary 1.0.0.1 caps base < 4.21,
  # excluding GHC 9.12 and 9.14, and lags QuickCheck. Scoped to that one
  # package so the library's own bounds stay enforced. Delete once
  # alunduil/network-arbitrary#106 ships.
  ALLOW_NEWER: --allow-newer=network-arbitrary:base,network-arbitrary:QuickCheck
  # renovate: datasource=github-tags depName=haskell/cabal versioning=loose extractVersion=^cabal-install-v(?<version>\d+\.\d+\.\d+\.\d+)$
  CABAL_VERSION: "3.18.2.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel main so each commit completes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      # SHA pinning is enforced transitively, so a replacement must pin the
      # actions it calls in turn.
      - uses: tox-dev/action-pre-commit-uv@9316eafda3550b0365575c60b9f53725a81d0cfd # v1.1.2

  # tested-with in siren-json.cabal is the only list of GHC versions. Other
  # jobs take their GHC versions from this job.
  ghc-versions:
    name: Read tested GHC versions
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.tested.outputs.matrix }}
      newest: ${{ steps.tested.outputs.newest }}

    env:
      # Renovate's githubActionsVersions manager only matches a *_VERSION key,
      # so the runner versions are env vars rather than inputs.
      # renovate: datasource=github-runners depName=ubuntu
      UBUNTU_VERSION: "26.04"
      # renovate: datasource=github-runners depName=macos
      MACOS_VERSION: "26"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read tested GHC versions
        id: tested
        uses: ./.github/actions/tested-ghc
        with:
          ubuntu-version: ${{ env.UBUNTU_VERSION }}
          macos-version: ${{ env.MACOS_VERSION }}

  build:
    name: GHC ${{ matrix.ghc }} / ${{ matrix.os }}
    needs: ghc-versions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ghc-versions.outputs.matrix) }}

    env:
      # Metadata and docs don't vary by GHC or OS, so one leg checks them.
      PACKAGE_CHECKS: ${{ matrix.newest && startsWith(matrix.os, 'ubuntu-') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up GHC
        id: setup
        uses: ./.github/actions/setup-ghc
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Update Hackage index
        run: cabal update

      # Everything below builds from the sdist tarball, not the working
      # tree: it exercises the published bounds a Hackage consumer faces
      # and catches a source or test file missing from the package.
      - name: Build sdist
        run: cabal sdist all

      - name: Unpack sdist
        shell: bash
        run: |
          mkdir sdist-build
          tar xf dist-newstyle/sdist/siren-json-*.tar.gz \
            -C sdist-build --strip-components=1

      - name: Generate build plan
        working-directory: sdist-build
        run: cabal build all --enable-tests --dry-run $ALLOW_NEWER

      - name: Restore cabal store
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('sdist-build/dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Install dependencies
        working-directory: sdist-build
        run: cabal build all --enable-tests --only-dependencies $ALLOW_NEWER

      - name: Save cabal store
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        working-directory: sdist-build
        run: cabal build all --enable-tests $ALLOW_NEWER

      - name: Test
        working-directory: sdist-build
        run: cabal test all --enable-tests --test-show-details=direct $ALLOW_NEWER

      - name: Check package metadata
        if: env.PACKAGE_CHECKS == 'true'
        working-directory: sdist-build
        run: cabal check

      - name: Haddock
        if: env.PACKAGE_CHECKS == 'true'
        working-directory: sdist-build
        run: cabal haddock all $ALLOW_NEWER

  coverage:
    name: Coverage
    needs: ghc-versions
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up GHC
        id: setup
        uses: ./.github/actions/setup-ghc
        with:
          ghc-version: ${{ needs.ghc-versions.outputs.newest }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Update Hackage index
        run: cabal update

      # Builds from the working tree, not the sdist the build job uses: hpc
      # writes .mix/.tix paths relative to the tree it compiled, and only
      # those map onto the src/ paths Codecov reports against.
      #
      # configure persists its flags to cabal.project.local, so later steps
      # inherit ALLOW_NEWER.
      - name: Configure with coverage
        run: cabal configure --enable-tests --enable-coverage $ALLOW_NEWER

      - name: Generate build plan
        run: cabal build all --dry-run

      - name: Restore cabal store
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Install dependencies
        run: cabal build all --only-dependencies

      - name: Save cabal store
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test all --test-show-details=direct

      # Test modules stay in the report and are dropped by the ignore glob in
      # codecov.yml; hpc-codecov's own --exclude takes exact names only.
      - name: Generate coverage report
        id: report
        uses: 8c6794b6/hpc-codecov-action@f943f40733e5390825b12d72165cad991e44340c # v4.3.0
        with:
          target: cabal:siren-json-tests

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.report.outputs.report }}
          fail_ci_if_error: true

  # The default-branch ruleset requires this job by name, so renaming it breaks
  # the merge gate. The build cells' names change with the GHC matrix.
  results:
    name: Check CI results
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [pre-commit, ghc-versions, build, coverage]
    if: always()

    steps:
      # Without always(), this step is skipped when a needed job is cancelled,
      # and the job passes.
      - name: Fail when any job did not succeed
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped'))
        run: exit 1
