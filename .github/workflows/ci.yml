name: CI

# Sensors that run on every integration event. Path-gated checks would have a
# narrower "when" and keep their own files.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Stopgap: the test-only network-arbitrary 1.0.0.1 caps base < 4.21,
  # excluding GHC 9.12 and 9.14, and lags QuickCheck. Scoped to that one
  # package so the library's own bounds stay enforced. Delete once
  # alunduil/network-arbitrary#106 ships.
  ALLOW_NEWER: --allow-newer=network-arbitrary:base,network-arbitrary:QuickCheck

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel main so each commit completes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # The fourmolu and hlint hooks are `language: system` and run whatever is
    # on PATH, so these two pins are what the formatting check actually
    # enforces. fourmolu's output changes between releases, so a developer
    # whose local binary differs from this pin sees the hook rewrite files CI
    # then rejects. alunduil/alunduil-chezmoi#661 tracks managing the host
    # copies so the two converge.
    #
    # The download layout is not stable across fourmolu releases either: the
    # linux asset became a zip in 0.20.0.0, having been a bare binary before,
    # so a bump may need the unpacking below adjusted.
    env:
      # Both tools version with PVP, whose four-component releases the default
      # semver-coerced versioning reports as unstable -- `ignoreUnstable` then
      # hides every update. `loose` compares them component-wise instead.
      # renovate: datasource=github-releases depName=fourmolu/fourmolu versioning=loose extractVersion=^v(?<version>.+)$
      FOURMOLU_VERSION: "0.20.1.0"
      # renovate: datasource=github-releases depName=ndmitchell/hlint versioning=loose extractVersion=^v(?<version>.+)$
      HLINT_VERSION: "3.10"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install fourmolu
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/fourmolu.zip \
            "https://github.com/fourmolu/fourmolu/releases/download/v${FOURMOLU_VERSION}/fourmolu-${FOURMOLU_VERSION}-linux-x86_64.zip"
          unzip -j /tmp/fourmolu.zip '*/fourmolu' -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/fourmolu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up HLint
        uses: haskell-actions/hlint-setup@fe9cd1cd1af94a23900c06738e73f6ddb092966a # v2
        with:
          version: ${{ env.HLINT_VERSION }}

      # SHA pinning is enforced transitively, so a replacement must pin the
      # actions it calls in turn.
      - uses: tox-dev/action-pre-commit-uv@e09b8958484dfe71f4ac3bc7afb230ba506402ec # v1.0.5

  build:
    name: GHC ${{ matrix.ghc }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ghc: ["9.6", "9.8", "9.10", "9.12", "9.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up GHC ${{ matrix.ghc }}
        id: setup
        uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2.12.0
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest

      - name: Update Hackage index
        run: cabal update

      # Everything below builds from the sdist tarball, not the working
      # tree: it exercises the published bounds a Hackage consumer faces
      # and catches a source or test file missing from the package.
      - name: Build sdist
        run: cabal sdist all

      - name: Unpack sdist
        shell: bash
        run: |
          mkdir sdist-build
          tar xf dist-newstyle/sdist/siren-json-*.tar.gz \
            -C sdist-build --strip-components=1

      - name: Generate build plan
        working-directory: sdist-build
        run: cabal build all --enable-tests --dry-run $ALLOW_NEWER

      - name: Restore cabal store
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('sdist-build/dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Install dependencies
        working-directory: sdist-build
        run: cabal build all --enable-tests --only-dependencies $ALLOW_NEWER

      - name: Save cabal store
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        working-directory: sdist-build
        run: cabal build all --enable-tests $ALLOW_NEWER

      - name: Test
        working-directory: sdist-build
        run: cabal test all --enable-tests --test-show-details=direct $ALLOW_NEWER

      - name: Check package metadata
        working-directory: sdist-build
        run: cabal check

      - name: Haddock
        working-directory: sdist-build
        run: cabal haddock all $ALLOW_NEWER

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up GHC
        uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2.12.0
        with:
          ghc-version: "9.14"
          cabal-version: latest

      - name: Update Hackage index
        run: cabal update

      # Builds from the working tree, not the sdist the build job uses: hpc
      # writes .mix/.tix paths relative to the tree it compiled, and only
      # those map onto the src/ paths Codecov reports against.
      #
      # configure persists its flags to cabal.project.local, so later steps
      # inherit ALLOW_NEWER.
      - name: Configure with coverage
        run: cabal configure --enable-tests --enable-coverage $ALLOW_NEWER

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test all --test-show-details=direct

      # Test modules stay in the report and are dropped by the ignore glob in
      # codecov.yml; hpc-codecov's own --exclude takes exact names only.
      - name: Generate coverage report
        id: report
        uses: 8c6794b6/hpc-codecov-action@f943f40733e5390825b12d72165cad991e44340c # v4.3.0
        with:
          target: cabal:siren-json-tests

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.report.outputs.report }}
          fail_ci_if_error: true
