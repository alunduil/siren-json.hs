name: Weekly

# These sensors watch state that changes without a commit. Nobody is waiting
# on a scheduled run, so each reports through a tracking issue instead of
# failing, refreshing the standing one rather than filing a new one weekly.

on:
  workflow_dispatch:
  schedule:
    # GitHub applies `timezone`, DST included, so this stays 18:00 local.
    - cron: "0 18 * * 5"
      timezone: "Europe/London"
  # Pull requests run the checks to test changes to this workflow before
  # merge. No paths filter: a required check must report on every pull request.
  pull_request:

permissions:
  contents: read

concurrency:
  # Each pull request gets its own group so its run never waits on the
  # scheduled one or cancels another pull request's.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  drift:
    name: Check GHC matrix drift
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      issue: ${{ steps.check.outputs.issue }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Policy (alunduil/collection-json.hs#141): test every GHC major
      # series upstream has not end-of-lifed.
      - name: Detect drift
        id: check
        run: |
          set -euo pipefail

          # Each query yields one series per line, sorted, so the sets
          # compare as strings. `|| true` turns a failed query into an empty
          # set for require_series to report; without it `set -e` kills the
          # step before the guard runs.
          upstream_series() {
            curl -fsSL https://endoflife.date/api/ghc.json \
              | jq -r 'map(select(.eol == false)) | .[].cycle' | sort -V || true
          }

          matrix_series() {
            yq '.jobs.build.strategy.matrix.ghc[].GHC_VERSION' \
              .github/workflows/ci.yml | sed -E 's/\.[0-9]+$//' | sort -V || true
          }

          tested_with_series() {
            grep -oE 'GHC == [0-9]+\.[0-9]+' siren-json.cabal \
              | grep -oE '[0-9]+\.[0-9]+' | sort -V || true
          }

          # An empty set means a schema change, a moved field, or a renamed
          # file. Aborting keeps that from filing an issue that reports
          # every series as drifted.
          require_series() {
            if [ -z "$2" ]; then
              echo "no GHC series parsed from $1; aborting" >&2
              exit 1
            fi
          }

          as_csv() { printf '%s' "$1" | paste -sd, -; }

          expected=$(upstream_series)
          require_series "endoflife.date" "$expected"

          matrix=$(matrix_series)
          require_series ".github/workflows/ci.yml" "$matrix"

          tested=$(tested_with_series)
          require_series "siren-json.cabal tested-with" "$tested"

          [ "$expected" = "$matrix" ] && [ "$expected" = "$tested" ] && exit 0

          # create-an-issue reads the title and labels from front matter.
          cat > ghc-drift-issue.md <<EOF
          ---
          title: GHC version matrix out of date
          labels:
            - infrastructure
          ---
          The CI matrix and \`tested-with\` should track every GHC major
          series upstream hasn't end-of-lifed (policy:
          alunduil/collection-json.hs#141).

          | Source | Series |
          | --- | --- |
          | Expected (endoflife.date, not end-of-life) | $(as_csv "$expected") |
          | CI matrix (\`.github/workflows/ci.yml\`) | $(as_csv "$matrix") |
          | \`tested-with\` (\`siren-json.cabal\`) | $(as_csv "$tested") |

          Update the matrix and \`tested-with\`, then bump per PVP
          (CI/packaging-only is a patch).
          EOF

          delimiter=$(openssl rand -hex 16)
          {
            echo "issue<<$delimiter"
            cat ghc-drift-issue.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  # Filing jobs are separate so the checks, which pull requests run, never hold
  # issues: write.
  file-drift-issue:
    name: File GHC matrix drift issue
    needs: drift
    if: >-
      needs.drift.outputs.issue != ''
      && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      issues: write

    steps:
      - name: Write drift issue
        env:
          ISSUE: ${{ needs.drift.outputs.issue }}
        run: printf '%s\n' "$ISSUE" > ghc-drift-issue.md

      - name: File or refresh drift issue
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          filename: ghc-drift-issue.md
          update_existing: true

  links:
    name: Check links
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      issue: ${{ steps.compose.outputs.issue }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Set up lychee
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: lychee

      # Only a pull request fails on a dead link; other runs go on to file an
      # issue. The token lifts GitHub's anonymous rate limit on github.com
      # links.
      - name: Check links
        id: lychee
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p lychee
          lychee --config lychee.toml --no-progress --mode task --format markdown './**/*.md' \
            | tee lychee/out.md "$GITHUB_STEP_SUMMARY"

      # create-an-issue reads the title and labels from front matter, which
      # lychee's report has no way to carry.
      - name: Compose broken-links issue
        id: compose
        if: steps.lychee.outcome == 'failure'
        run: |
          set -euo pipefail

          cat > broken-links-issue.md <<'EOF'
          ---
          title: Broken links detected
          labels:
            - documentation
          ---
          EOF
          cat lychee/out.md >> broken-links-issue.md

          delimiter=$(openssl rand -hex 16)
          {
            echo "issue<<$delimiter"
            cat broken-links-issue.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  file-links-issue:
    name: File broken-links issue
    needs: links
    if: >-
      needs.links.outputs.issue != ''
      && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      issues: write

    steps:
      - name: Write broken-links issue
        env:
          ISSUE: ${{ needs.links.outputs.issue }}
        run: printf '%s\n' "$ISSUE" > broken-links-issue.md

      - name: File or refresh broken-links issue
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          filename: broken-links-issue.md
          update_existing: true
