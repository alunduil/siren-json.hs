name: Weekly

# Sensors that run on a cadence rather than on an integration event: they
# watch state that changes without a commit. Each files a tracking issue
# instead of failing, since nobody is waiting on the run, and each passes
# update_existing so a standing issue is refreshed in place rather than
# duplicated every Friday.

on:
  workflow_dispatch:
  schedule:
    # Fridays 18:00 Europe/London. GitHub applies the timezone (and DST), so
    # the report is waiting at 18:00 local year-round.
    - cron: "0 18 * * 5"
      timezone: "Europe/London"

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  drift:
    name: Check GHC matrix drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Policy (alunduil/collection-json.hs#141): test every GHC major
      # series upstream has not end-of-lifed.
      - name: Detect drift
        id: check
        run: |
          set -euo pipefail

          # Each query yields one series per line, sorted, so the sets
          # compare as strings. `|| true` turns a failed query into an empty
          # set for require_series to report; without it `set -e` kills the
          # step before the guard runs.
          upstream_series() {
            curl -fsSL https://endoflife.date/api/ghc.json \
              | jq -r 'map(select(.eol == false)) | .[].cycle' | sort -V || true
          }

          matrix_series() {
            yq '.jobs.build.strategy.matrix.ghc[]' \
              .github/workflows/ci.yml | sort -V || true
          }

          tested_with_series() {
            grep -oE 'GHC == [0-9]+\.[0-9]+' siren-json.cabal \
              | grep -oE '[0-9]+\.[0-9]+' | sort -V || true
          }

          # An empty set means a schema change, a moved field, or a renamed
          # file. Aborting keeps that from filing an issue that reports
          # every series as drifted.
          require_series() {
            if [ -z "$2" ]; then
              echo "no GHC series parsed from $1; aborting" >&2
              exit 1
            fi
          }

          as_csv() { printf '%s' "$1" | paste -sd, -; }

          expected=$(upstream_series)
          require_series "endoflife.date" "$expected"

          matrix=$(matrix_series)
          require_series ".github/workflows/ci.yml" "$matrix"

          tested=$(tested_with_series)
          require_series "siren-json.cabal tested-with" "$tested"

          drift=false
          [ "$expected" = "$matrix" ] || drift=true
          [ "$expected" = "$tested" ] || drift=true
          echo "drift=$drift" >> "$GITHUB_OUTPUT"

          [ "$drift" = true ] || exit 0

          # create-an-issue reads the title and labels from front matter.
          cat > ghc-drift-issue.md <<EOF
          ---
          title: GHC version matrix out of date
          labels:
            - infrastructure
          ---
          The CI matrix and \`tested-with\` should track every GHC major
          series upstream hasn't end-of-lifed (policy:
          alunduil/collection-json.hs#141).

          | Source | Series |
          | --- | --- |
          | Expected (endoflife.date, not end-of-life) | $(as_csv "$expected") |
          | CI matrix (\`.github/workflows/ci.yml\`) | $(as_csv "$matrix") |
          | \`tested-with\` (\`siren-json.cabal\`) | $(as_csv "$tested") |

          Update the matrix and \`tested-with\`, then bump per PVP
          (CI/packaging-only is a patch).
          EOF

      - name: File or refresh drift issue
        if: steps.check.outputs.drift == 'true'
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          filename: ghc-drift-issue.md
          update_existing: true

  links:
    name: Check links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      # Link rot happens without a commit, so this sweep re-checks links the
      # ci.yml job last saw when they still resolved. fail: false keeps the
      # run green so the next step reports through an issue instead.
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml "./**/*.md"
          fail: false

      # create-an-issue takes the title and labels from front matter, which
      # lychee's report (lychee/out.md) has no way to carry.
      - name: Compose broken-links issue
        if: steps.lychee.outputs.exit_code != 0
        run: |
          set -euo pipefail

          cat > broken-links-issue.md <<'EOF'
          ---
          title: Broken links detected
          labels:
            - documentation
          ---
          EOF
          cat lychee/out.md >> broken-links-issue.md

      - name: File or refresh broken-links issue
        if: steps.lychee.outputs.exit_code != 0
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          filename: broken-links-issue.md
          update_existing: true
