name: Build release artifacts
description: >-
  Build the sdist and Haddock tarballs a Hackage upload consumes, leaving them
  under dist-newstyle for the caller to upload.

# Shared by the candidate and publish jobs so the two cannot drift apart. They
# build the artifact that gets reviewed and the artifact that gets published
# respectively, and a publish is immutable, so any difference between the two
# build sequences ships something nobody looked at.
#
# Deliberately takes no `publish` flag. The only difference between the two
# callers is the `--publish` argument to `cabal upload`, and that stays at the
# call site where the reader can see which one they are getting.

runs:
  using: composite

  steps:
    - name: Set up GHC
      uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2.12.0
      with:
        ghc-version: latest
        cabal-version: latest

    - name: Update Hackage index
      shell: bash
      run: cabal update

    - name: Build sdist
      shell: bash
      run: cabal sdist

    - name: Build documentation
      shell: bash
      run: cabal haddock --haddock-for-hackage
