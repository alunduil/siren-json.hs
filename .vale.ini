# Rules keep the severity their package ships, and prose is rewritten to
# comply rather than demoted to silence a finding. The exceptions below
# dedupe rules that overlap across packages.

StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Microsoft, proselint, alex
Vocab = siren-json-hs

[*.md]
BasedOnStyles = Vale, Microsoft, proselint, alex
proselint.Cliches = NO     # Microsoft.Terms covers the same ground
proselint.Spelling = NO    # Vale.Spelling owns spelling

# Documents that aren't ours to restyle: CLAUDE.md is AI-targeted guidance
# in a terse register, CODE_OF_CONDUCT.md the verbatim Contributor
# Covenant, CHANGELOG.md structured release notes rather than prose.
[{CLAUDE,CODE_OF_CONDUCT,CHANGELOG}.md]
BasedOnStyles =
