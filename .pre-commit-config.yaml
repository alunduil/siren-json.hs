repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.46.0
    hooks:
      - id: renovate-config-validator
        args: [--strict, --no-global]

  # Renovate's pre-commit manager tracks only hooks carrying a `rev:`, so the
  # pinned fourmolu and hlint versions live in `.github/workflows/ci.yml`.
  - repo: local
    hooks:
      - id: fourmolu
        name: fourmolu
        entry: fourmolu --mode inplace
        language: system
        types: [haskell]
      - id: hlint
        name: hlint
        entry: hlint
        language: system
        types: [haskell]
