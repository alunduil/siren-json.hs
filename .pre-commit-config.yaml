# `vale sync` writes .vale/styles/; only config/ under it is ours.
exclude: ^\.vale/styles/(?!config/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  # Vale's documented setup pairs this with a `vale sync` hook. The styles
  # are vendored, so there is nothing to fetch.
  - repo: https://github.com/errata-ai/vale
    rev: v3.19.0
    hooks:
      - id: vale
        args: [--output=line, --minAlertLevel=error]
        types: [markdown]

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.45.3
    hooks:
      - id: renovate-config-validator
        args: [--strict, --no-global]

  # Renovate's pre-commit manager tracks only hooks carrying a `rev:`, so the
  # pinned fourmolu, hlint, and lychee versions live in
  # `.github/workflows/ci.yml`.
  - repo: local
    hooks:
      - id: fourmolu
        name: fourmolu
        entry: fourmolu --mode inplace
        language: system
        types: [haskell]
      - id: hlint
        name: hlint
        entry: hlint
        language: system
        types: [haskell]

      # --offline gates on the relative links, which break with the diff that
      # renames their target. External URLs rot on their own schedule, so the
      # links jobs own those.
      - id: lychee
        name: lychee
        entry: lychee --config lychee.toml --offline
        language: system
        types: [markdown]
