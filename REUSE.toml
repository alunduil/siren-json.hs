# Copyright and licensing for files that don't carry an inline SPDX header.

version = 1
SPDX-PackageName = "siren-json"
SPDX-PackageSupplier = "Alex Brandt <alunduil@alunduil.com>"
SPDX-PackageDownloadLocation = "https://github.com/alunduil/siren-json.hs"

# Ours, declared here because the format rejects a header or renders one.

[[annotations]]
path = [
  "**.json",                # JSON admits no comments
  ".markdownlint.jsonc",    # markdownlint-cli2 reads it as JSON in places
  "**.md",                  # an HTML comment header shows in some viewers
  ".gitignore",             # a header would read as a pattern comment
  "LICENSE",                # copy of LICENSES/MIT.txt; GitHub's license
                            # detector only matches root-level filenames
  ".vale/styles/config/**", # our Vale vocabulary, not a vendored pack
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2017 Alex Brandt <alunduil@alunduil.com>"
SPDX-License-Identifier = "MIT"

# Vale style packs vendored by `vale sync`. Each pack carries its own
# upstream author and license -- one stanza per pack, so adding or removing
# a pack stays localised and a non-MIT pack surfaces in review instead of
# disappearing under an aggregate.

[[annotations]]
path = ".vale/styles/Microsoft/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2018-2019 Joseph Kato"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ".vale/styles/proselint/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2019 errata.ai"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ".vale/styles/alex/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 errata.ai"
SPDX-License-Identifier = "MIT"
