# HLint configuration for siren-json.
# Reference: https://github.com/ndmitchell/hlint#readme
#
# The dotted filename is what hlint auto-discovers; a plain `hlint.yaml` is
# read only when passed with `-h` (see alunduil/collection-json.hs#309).

- arguments: [--color=auto]

- group: {name: future, enabled: true}
- group: {name: partial, enabled: true}
- group: {name: partial-strict, enabled: true}

# unsafePerformIO has no place in a pure data-modelling library.
- functions:
    - {name: unsafePerformIO, within: []}

# Both partial calls in the test suite have their arguments fixed at the call
# site: a hard-coded literal URI passed to fromJust, and a literal divisor of
# 2 in a QuickCheck size scale. Neither can reach its failing case.
- ignore:
    name: Avoid partial function
    within:
      - Data.SirenJSONSpec
      - Data.SirenJSON.Arbitrary
